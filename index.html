<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Persona Stats Tracker</title>

<style>

:root{
  --bg:#071530;
  --bg2:#091f45;
  --cyan:#00e5ff;
  --pink:#ff4d8f;
  --white:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100vh;
  background:
    linear-gradient(
      135deg,
      #020617 0%,
      #08162f 40%,
      #0b2458 100%
    );
  overflow-x:hidden;
  font-family:
    "Segoe UI",
    sans-serif;
  color:white;
}

/* giant background text */

body::before{
  content:"STATUS";

  position:fixed;

  bottom:-3vw;
  left:-1vw;

  font-size:clamp(
    90px,
    20vw,
    260px
  );

  font-weight:900;

  color:
    rgba(
      255,
      255,
      255,
      .05
    );

  pointer-events:none;
}

/* floating shards */

body::after{
  content:"";

  position:fixed;

  top:0;
  right:0;

  width:45vw;
  height:45vw;

  background:
  linear-gradient(
      135deg,
      transparent 60%,
      rgba(0,229,255,.15)
      60%
  );

  clip-path:
      polygon(
        0 0,
        100% 0,
        80% 30%,
        100% 100%,
        30% 70%
      );

  pointer-events:none;
}

.wrapper{
  width:100%;
  padding:18px;
}

/* ==========================
   TOP MENU
========================== */

.tabs{

  display:flex;
  gap:8px;

  margin-bottom:18px;
}

.tab{

  padding:
    10px
    18px;

  background:
    rgba(
      255,
      255,
      255,
      .08
    );

  clip-path:
    polygon(
      0 0,
      92% 0,
      100% 50%,
      92% 100%,
      0 100%
    );

  font-weight:700;

  transition:.2s;
}

.tab:hover{
  transform:
    translateX(6px);
}

.active{
  background:white;
  color:#001326;
}

/* ==========================
   LEVEL SECTION
========================== */

.level-box{

  border-top:
    3px solid
    var(--pink);

  background:
    rgba(
      255,
      255,
      255,
      .05
    );

  padding:14px;
  margin-bottom:18px;
}

.level-row{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;
}

.level{

  font-size:
    clamp(
      28px,
      6vw,
      54px
    );

  font-weight:900;
}

.xp-bar{

  height:12px;
  background:#14254b;
  overflow:hidden;
}

.xp-fill{

  height:100%;
  width:0%;

  background:
    linear-gradient(
      90deg,
      var(--cyan),
      white
    );

  transition:.4s;
}

/* ==========================
   STAT BLOCKS
========================== */

.stats{

  display:flex;
  flex-direction:column;
  gap:12px;
}

.stat{

  background:
    rgba(
      255,
      255,
      255,
      .04
    );

  padding:14px;

  border-left:
    4px solid
    transparent;

  transition:
    .25s;
}

.stat:hover{

  transform:
    translateX(10px);

  border-left:
    4px solid
    var(--cyan);
}

.stat-header{

  display:flex;
  justify-content:space-between;

  margin-bottom:8px;
}

.stat-name{

  color:
    var(--cyan);

  font-weight:800;
  letter-spacing:2px;
}

.rank{

  font-size:12px;

  color:
    #a5dfff;

  margin-bottom:8px;
}

.bar{

  height:12px;

  background:
    #122344;

  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  transition:.4s;
}

.k{
  background:
  linear-gradient(
    90deg,
    #00d9ff,
    #7ffcff
  );
}

.s{
  background:
  linear-gradient(
    90deg,
    #ff4d8f,
    #ff9ac3
  );
}

.m{
  background:
  linear-gradient(
    90deg,
    #84ffd0,
    #d8fff1
  );
}

.c{
  background:
  linear-gradient(
    90deg,
    #ffd166,
    #fff2ba
  );
}

/* ==========================
   BUTTONS
========================== */

.controls{

  margin-top:20px;

  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        140px,
        1fr
      )
    );

  gap:8px;
}

button{

  position:relative;

  overflow:hidden;

  background:
    #08162f;

  color:white;

  border:
    1px solid
    var(--cyan);

  padding:10px;

  cursor:pointer;

  font-weight:700;
}

button::before{

  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:100%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.4),
      transparent
    );

  transform:
    skewX(-25deg);

  transition:.35s;
}

button:hover::before{
  left:120%;
}

button:hover{
  background:
    var(--cyan);
  color:#001326;
}

.reset{
  border-color:
    var(--pink);
}

.reset:hover{
  background:
    var(--pink);
  color:white;
}

.footer{

  margin-top:20px;

  text-align:center;

  color:#8ecfff;

  font-size:11px;

  letter-spacing:2px;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="tabs">
<div class="tab active">STATUS</div>
<div class="tab">SOCIAL</div>
<div class="tab">TRACKER</div>
</div>

<div class="level-box">

<div class="level-row">
<div>
<div>LEVEL</div>
<div
class="level"
id="level">
1
</div>
</div>

<div id="xpText">
0 / 100 XP
</div>
</div>

<div class="xp-bar">
<div
class="xp-fill"
id="xpFill">
</div>
</div>

</div>

<div class="stats">

<div class="stat">
<div class="stat-header">
<div class="stat-name">
KNOWLEDGE
</div>
<div id="kVal">
0
</div>
</div>

<div
class="rank"
id="kRank">
Average
</div>

<div class="bar">
<div
class="fill k"
id="kBar">
</div>
</div>
</div>

<div class="stat">
<div class="stat-header">
<div class="stat-name">
SOCIAL
</div>
<div id="sVal">
0
</div>
</div>

<div
class="rank"
id="sRank">
Average
</div>

<div class="bar">
<div
class="fill s"
id="sBar">
</div>
</div>
</div>

<div class="stat">
<div class="stat-header">
<div class="stat-name">
MORAL
</div>
<div id="mVal">
0
</div>
</div>

<div
class="rank"
id="mRank">
Average
</div>

<div class="bar">
<div
class="fill m"
id="mBar">
</div>
</div>
</div>

<div class="stat">
<div class="stat-header">
<div class="stat-name">
COURAGE
</div>
<div id="cVal">
0
</div>
</div>

<div
class="rank"
id="cRank">
Average
</div>

<div class="bar">
<div
class="fill c"
id="cBar">
</div>
</div>
</div>

</div>

<div class="controls">

<button onclick="add('knowledge')">
+ KNOWLEDGE
</button>

<button onclick="add('social')">
+ SOCIAL
</button>

<button onclick="add('moral')">
+ MORAL
</button>

<button onclick="add('courage')">
+ COURAGE
</button>

<button
class="reset"
onclick="resetAll()">
RESET
</button>

</div>

<div class="footer">
PERSONA INSPIRED STAT TRACKER
</div>

</div>

<script>

const MAX = 100;

const ranks = [
"Average",
"Aware",
"Smart",
"Sharp",
"Brilliant",
"Genius"
];

let stats = {
knowledge:0,
social:0,
moral:0,
courage:0
};

let player = {
level:1,
xp:0
};

const saveStats =
localStorage.getItem(
"personaStats"
);

const savePlayer =
localStorage.getItem(
"personaPlayer"
);

if(saveStats)
stats =
JSON.parse(
saveStats
);

if(savePlayer)
player =
JSON.parse(
savePlayer
);

function rank(v){

if(v<20)return ranks[0];
if(v<40)return ranks[1];
if(v<60)return ranks[2];
if(v<80)return ranks[3];
if(v<100)return ranks[4];

return ranks[5];
}

function xpNeeded(){
return player.level*100;
}

function gainXP(amount){

player.xp += amount;

while(
player.xp >= xpNeeded()
){

player.xp -= xpNeeded();
player.level++;
}

}

function add(stat){

stats[stat] =
Math.min(
100,
stats[stat]+5
);

gainXP(15);

update();
}

function update(){

kBar.style.width =
stats.knowledge+"%";

sBar.style.width =
stats.social+"%";

mBar.style.width =
stats.moral+"%";

cBar.style.width =
stats.courage+"%";

kVal.textContent =
stats.knowledge;

sVal.textContent =
stats.social;

mVal.textContent =
stats.moral;

cVal.textContent =
stats.courage;

kRank.textContent =
rank(stats.knowledge);

sRank.textContent =
rank(stats.social);

mRank.textContent =
rank(stats.moral);

cRank.textContent =
rank(stats.courage);

level.textContent =
player.level;

xpText.textContent =
`${player.xp} / ${xpNeeded()} XP`;

xpFill.style.width =
(player.xp/xpNeeded())
*100+"%";

localStorage.setItem(
"personaStats",
JSON.stringify(stats)
);

localStorage.setItem(
"personaPlayer",
JSON.stringify(player)
);

}

function resetAll(){

stats={
knowledge:0,
social:0,
moral:0,
courage:0
};

player={
level:1,
xp:0
};

update();
}

update();

</script>

</body>
</html>
