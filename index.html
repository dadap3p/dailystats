<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Style Stats Tracker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            135deg,
            #020617 0%,
            #08162f 45%,
            #0a2155 100%
        );

    font-family: "Segoe UI", sans-serif;
    color:white;
    overflow:hidden;
}

/* giant faded text */
body::before{
    content:"STATUS";
    position:absolute;
    bottom:-30px;
    left:-20px;
    font-size:160px;
    font-weight:900;
    color:rgba(255,255,255,0.04);
    letter-spacing:10px;
    pointer-events:none;
}

.widget{
    width:420px;

    background:
        linear-gradient(
            145deg,
            rgba(10,20,45,.95),
            rgba(5,10,25,.98)
        );

    border:2px solid #6ee7ff;

    clip-path: polygon(
        0 0,
        94% 0,
        100% 8%,
        100% 100%,
        6% 100%,
        0 92%
    );

    padding:24px;

    box-shadow:
        0 0 30px rgba(0,200,255,.25),
        inset 0 0 30px rgba(0,200,255,.08);

    position:relative;
}

/* decorative accent */
.widget::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:90px;
    height:90px;

    background:
        linear-gradient(
            135deg,
            transparent 50%,
            #00d9ff 50%
        );

    opacity:.2;
}

.header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
}

.header::before{
    content:"";
    width:60px;
    height:4px;
    background:#00d9ff;
    box-shadow:0 0 10px #00d9ff;
}

.header h1{
    font-size:22px;
    letter-spacing:3px;
    font-weight:900;
}

.total{
    text-align:center;
    margin-bottom:24px;
}

.total-label{
    color:#7dd3ff;
    letter-spacing:4px;
    font-size:12px;
}

.total-value{
    font-size:56px;
    font-weight:900;
    line-height:1;
}

.stat{
    display:grid;
    grid-template-columns:100px 1fr 40px;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
}

.stat-name{
    font-size:12px;
    letter-spacing:2px;
    font-weight:700;
}

.bar{
    height:12px;
    background:#12213f;
    overflow:hidden;
    position:relative;
}

.fill{
    height:100%;
    width:0%;
    transition:0.4s ease;
}

.knowledge{
    background:linear-gradient(
        90deg,
        #38bdf8,
        #00ffff
    );
}

.social{
    background:linear-gradient(
        90deg,
        #ff3d8d,
        #ff77c5
    );
}

.moral{
    background:linear-gradient(
        90deg,
        #8dffc9,
        #dcfff1
    );
}

.courage{
    background:linear-gradient(
        90deg,
        #ffd166,
        #fff0b8
    );
}

.value{
    text-align:right;
    font-weight:700;
}

.buttons{
    margin-top:24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

button{
    background:#08162f;
    color:white;
    border:1px solid #6ee7ff;
    padding:10px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    transition:.2s;
}

button:hover{
    background:#00d9ff;
    color:#00111f;

    box-shadow:
        0 0 15px rgba(0,217,255,.6);
}

.reset{
    grid-column:span 2;
    border-color:#ff5c8a;
}

.reset:hover{
    background:#ff5c8a;
    color:white;
}

.footer{
    margin-top:18px;
    text-align:center;
    font-size:11px;
    color:#7aa9d6;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="widget">

    <div class="header">
        <h1>PERSONAL STATS</h1>
    </div>

    <div class="total">
        <div class="total-label">TOTAL</div>
        <div id="totalValue" class="total-value">0</div>
    </div>

    <div class="stat">
        <div class="stat-name">KNOWLEDGE</div>
        <div class="bar">
            <div id="kBar" class="fill knowledge"></div>
        </div>
        <div id="kVal" class="value">0</div>
    </div>

    <div class="stat">
        <div class="stat-name">SOCIAL</div>
        <div class="bar">
            <div id="sBar" class="fill social"></div>
        </div>
        <div id="sVal" class="value">0</div>
    </div>

    <div class="stat">
        <div class="stat-name">MORAL</div>
        <div class="bar">
            <div id="mBar" class="fill moral"></div>
        </div>
        <div id="mVal" class="value">0</div>
    </div>

    <div class="stat">
        <div class="stat-name">COURAGE</div>
        <div class="bar">
            <div id="cBar" class="fill courage"></div>
        </div>
        <div id="cVal" class="value">0</div>
    </div>

    <div class="buttons">
        <button onclick="add('knowledge')">+ KNOWLEDGE</button>
        <button onclick="add('social')">+ SOCIAL</button>

        <button onclick="add('moral')">+ MORAL</button>
        <button onclick="add('courage')">+ COURAGE</button>

        <button class="reset" onclick="resetAll()">RESET ALL</button>
    </div>

    <div class="footer">
        PERSONA STYLE TRACKER
    </div>

</div>

<script>

const MAX = 100;

const stats = {
    knowledge: 0,
    social: 0,
    moral: 0,
    courage: 0
};

const saved = localStorage.getItem("personaStats");

if(saved){
    Object.assign(stats, JSON.parse(saved));
}

function save(){
    localStorage.setItem(
        "personaStats",
        JSON.stringify(stats)
    );
}

function updateUI(){

    document.getElementById("kBar").style.width =
        stats.knowledge + "%";

    document.getElementById("sBar").style.width =
        stats.social + "%";

    document.getElementById("mBar").style.width =
        stats.moral + "%";

    document.getElementById("cBar").style.width =
        stats.courage + "%";

    document.getElementById("kVal").textContent =
        stats.knowledge;

    document.getElementById("sVal").textContent =
        stats.social;

    document.getElementById("mVal").textContent =
        stats.moral;

    document.getElementById("cVal").textContent =
        stats.courage;

    document.getElementById("totalValue").textContent =
        stats.knowledge +
        stats.social +
        stats.moral +
        stats.courage;

    save();
}

function add(stat){
    stats[stat] = Math.min(
        MAX,
        stats[stat] + 5
    );

    updateUI();
}

function resetAll(){

    stats.knowledge = 0;
    stats.social = 0;
    stats.moral = 0;
    stats.courage = 0;

    updateUI();
}

updateUI();

</script>

</body>
</html>
