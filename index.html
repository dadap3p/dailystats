<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{
  --bg:#0b1325;
  --cyan:#63dfff;
  --blue:#4e88ff;
  --deep:#2147d8;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:transparent;
  font-family:'Segoe UI',sans-serif;
}

.widget{
  aspect-ratio:1/1;
  width:min(100vw,500px);

  position:relative;
  overflow:hidden;

  background:#0f172a;
}

.rankup{
  position:absolute;
  top:8%;
  left:8%;

  font-size:3rem;
  font-weight:900;

  color:#00eaff;

  transform:skew(-12deg);
}

.circle{
  position:absolute;

  width:60%;
  height:60%;

  border-radius:50%;

  background:rgba(98,196,255,.8);

  top:20%;
  left:20%;
}

.circle2{
  width:40%;
  height:40%;

  left:48%;
  top:12%;

  background:rgba(145,225,255,.6);
}

.content{
  position:absolute;

  inset:0;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;
}

.number{
  font-size:7rem;
  font-weight:900;
}

.stat{
  font-size:2rem;
  letter-spacing:.2em;
}

.rank{
  margin-top:.5rem;

  background:black;
  padding:.3rem 1rem;

  font-weight:700;
}
/* Circles */

.circle{
  position:absolute;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  backdrop-filter:blur(4px);
}

.courage{
  width:52%;
  height:52%;
  left:22%;
  top:40%;

  background:rgba(87,145,255,.8);
}

.charm{
  width:42%;
  height:42%;
  left:48%;
  top:18%;

  background:rgba(120,210,255,.85);
}

.academics{
  width:40%;
  height:40%;
  left:54%;
  top:52%;

  background:rgba(45,75,255,.9);
}

/* Rings */

.ring{
  position:absolute;
  inset:-12px;
  border:4px solid rgba(100,170,255,.5);
  border-radius:50%;
}

.ring:nth-child(2){
  inset:-22px;
}

.ring:nth-child(3){
  inset:-32px;
}

/* Text */

.big-number{
  font-size:clamp(3rem,12vw,7rem);
  font-weight:900;
}

.stat-name{
  font-size:clamp(1rem,3vw,2rem);
  font-weight:700;
}

.yellow{
  color:#ffd93b;
}

.white{
  color:white;
}

/* Triangle */

.triangle{
  position:absolute;
  width:18%;
  height:18%;
  left:49%;
  top:48%;

  clip-path:polygon(
    50% 0%,
    0% 100%,
    100% 100%
  );

  background:
    rgba(255,255,255,.15);

  border:2px solid rgba(255,255,255,.8);

  transform:translate(-50%,-50%);
}

/* Labels */

.label{
  position:absolute;
  background:black;
  padding:.4rem .9rem;

  font-weight:700;
  font-size:clamp(.7rem,2vw,1.2rem);

  white-space:nowrap;
}

.fearless{
  left:35%;
  top:78%;
}

.smooth{
  left:73%;
  top:42%;
}

.average{
  left:72%;
  top:78%;
}

/* Controls */

.controls{
  position:absolute;
  bottom:4%;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
  justify-content:center;
}

button{
  background:#00d8ff;
  color:#00111a;

  border:none;
  padding:.5rem .8rem;
  cursor:pointer;
  font-weight:700;

  border-radius:4px;
}

button:hover{
  filter:brightness(1.1);
}
</style>
</head>

<body>

<div class="widget">

  <div class="rankup">RANK UP!</div>

  <div class="circle"></div>
  <div class="circle circle2"></div>

  <div class="content">
    <div class="number">5</div>
    <div class="stat">COURAGE</div>
    <div class="rank">Fearless</div>
  </div>

</div>

<div class="circle courage">
  <div>
    <span class="stat-name yellow">Courage</span>
    <span class="big-number yellow">5</span>
  </div>

  <div class="ring"></div>
  <div class="ring"></div>
</div>

<div class="circle academics">
  <div>
    <span class="big-number">3</span>
    <span class="stat-name">Academics</span>
  </div>

  <div class="ring"></div>
  <div class="ring"></div>
</div>

<div class="triangle"></div>

<div class="label fearless">Fearless</div>
<div class="label smooth">Smooth</div>
<div class="label average">Above Average</div>

<div class="controls">
  <button onclick="change('courage',1)">+ Courage</button>
  <button onclick="change('charm',1)">+ Charm</button>
  <button onclick="change('academics',1)">+ Academics</button>
</div>

</div>

<script>
const stats={
  courage:5,
  charm:4,
  academics:3
};

function change(stat,val){
  stats[stat]+=val;

  const mapping={
    courage:'.courage .big-number',
    charm:'.charm .big-number',
    academics:'.academics .big-number'
  };

  document.querySelector(mapping[stat]).textContent=
    stats[stat];

  localStorage.setItem(
    'p3stats',
    JSON.stringify(stats)
  );
}

const saved=
JSON.parse(
localStorage.getItem('p3stats')
);

if(saved){
  Object.assign(stats,saved);

  document.querySelector('.courage .big-number').textContent=stats.courage;
  document.querySelector('.charm .big-number').textContent=stats.charm;
  document.querySelector('.academics .big-number').textContent=stats.academics;
}
</script>

</body>
</html>
