<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Persona Stats Widget</title>

<style>
:root{
  --size: 360px; /* ⬅️ CHANGE THIS TO SCALE FOR NOTION */
  --bg:#070A12;
  --blue:#4cc9f0;
  --pink:#f72585;
  --green:#b8f7d4;
  --yellow:#ffd166;
}

body{
  margin:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
  overflow:hidden;
}

/* MAIN WRAPPER */
.widget{
  width:var(--size);
  height:var(--size);
  position:relative;
  transform:skewY(-2deg);
}

/* BACKGROUND GLOW */
.widget::before{
  content:"";
  position:absolute;
  inset:-40px;
  background: radial-gradient(circle at 30% 20%, #4cc9f022, transparent 40%),
              radial-gradient(circle at 70% 80%, #f7258522, transparent 45%);
  filter:blur(10px);
  animation: glow 6s infinite alternate;
}

@keyframes glow{
  from{opacity:0.7;}
  to{opacity:1;}
}

/* SVG */
svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

/* BACK RINGS */
.bg-ring{
  fill:none;
  stroke:#1a2238;
  stroke-width:14;
  opacity:0.9;
}

/* ACTIVE RINGS */
.stat{
  fill:none;
  stroke-width:12;
  stroke-linecap:round;
  filter: drop-shadow(0 0 6px currentColor);
  transition:0.6s ease;
}

/* CENTER UI */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) skewY(2deg);
  text-align:center;
  z-index:2;
}

.title{
  font-size:14px;
  letter-spacing:4px;
  color:#7dd3ff;
  margin-bottom:6px;
}

/* PERSONA STYLE BANNER */
.banner{
  position:absolute;
  top:10px;
  left:-20px;
  transform:rotate(-12deg);
  font-size:18px;
  font-weight:bold;
  letter-spacing:2px;
  color:#fff;
  background:#f72585;
  padding:4px 10px;
  box-shadow:4px 4px 0 #000;
}

/* STATS TEXT */
.statsText{
  position:absolute;
  bottom:12px;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-size:10px;
  opacity:0.9;
}

/* CLICK HINT */
.hint{
  position:absolute;
  bottom:32px;
  width:100%;
  text-align:center;
  font-size:9px;
  opacity:0.6;
}

/* CLICK AREA */
.clickLayer{
  position:absolute;
  inset:0;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="widget" id="widget">

<div class="banner">RANK UP</div>

<svg id="svg"></svg>

<div class="center">
  <div class="title">SOCIAL STATS</div>
</div>

<div class="hint">Click to +5 Knowledge • Shift+Click changes stat</div>

<div class="statsText" id="labels"></div>

<div class="clickLayer" onclick="handleClick(event)"></div>

</div>

<script>

const stats = [
  {name:"Knowledge", value:20, color:"#4cc9f0"},
  {name:"Social", value:15, color:"#f72585"},
  {name:"Moral", value:10, color:"#b8f7d4"},
  {name:"Courage", value:25, color:"#ffd166"}
];

let active = 0;

const MAX = 100;

/* LOAD SAVE */
const saved = localStorage.getItem("persona_compact");
if(saved){
  Object.assign(stats, JSON.parse(saved));
}

/* SAVE */
function save(){
  localStorage.setItem("persona_compact", JSON.stringify(stats));
}

/* RENDER SVG */
function render(){
  const svg = document.getElementById("svg");
  svg.innerHTML = "";

  const baseR = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--size'))/2.4;

  stats.forEach((s,i)=>{
    const r = baseR - i*18;
    const c = 2*Math.PI*r;

    let circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx","50%");
    circle.setAttribute("cy","50%");
    circle.setAttribute("r",r);
    circle.setAttribute("class","stat");
    circle.style.stroke = s.color;
    circle.style.strokeDasharray = c;
    circle.style.strokeDashoffset = c - (s.value/MAX)*c;

    svg.appendChild(circle);
  });

  document.getElementById("labels").innerHTML =
    stats.map(s=>`<div style="color:${s.color}">${s.name} ${s.value}</div>`).join("");

  save();
}

/* CLICK SYSTEM (Persona-style interaction) */
function handleClick(e){

  if(e.shiftKey){
    active = (active + 1) % stats.length;
    return;
  }

  stats[active].value = Math.min(MAX, stats[active].value + 5);

  /* soft animation pop */
  document.getElementById("widget").style.transform = "skewY(-2deg) scale(1.02)";
  setTimeout(()=>{
    document.getElementById("widget").style.transform = "skewY(-2deg) scale(1)";
  },120);

  render();
}

/* INIT */
render();

</script>

</body>
</html>
